<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="coi.js"></script>
    <title>Digital Strobe Tuner</title>
    <link rel="stylesheet" href="style.css?v=1" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Digital Strobe Tuner</h1>
        <button id="start-btn">Start Audio</button>
      </header>

      <div class="controls-panel">
        <div class="control-group">
          <label for="a4-freq">A4 Reference (Hz):</label>
          <input
            type="number"
            id="a4-freq"
            min="400"
            max="480"
            step="0.1"
            value="440.0"
          />
        </div>

        <div class="control-group">
          <label for="stretch-tuning">Stretch Tuning:</label>
          <select id="stretch-tuning">
            <option value="equal">Equal Temperament</option>
            <option value="concertGrand">Concert Grand</option>
            <option value="studioGrand">Studio Grand</option>
            <option value="average">Average</option>
            <option value="smallGrand">Small Grand</option>
            <option value="upright">Upright</option>
            <option value="vertical">Vertical</option>
            <option value="console">Console</option>
            <option value="spinet">Spinet</option>
          </select>
        </div>

        <div class="control-group">
          <label for="cents-offset"
            >Cents Offset: <span id="cents-val">0.0</span></label
          >
          <input
            type="range"
            id="cents-offset"
            min="-50"
            max="50"
            step="0.5"
            value="0.0"
          />
        </div>

        <div class="control-group">
          <label for="mic-sensitivity"
            >Mic Sensitivity (dB): <span id="sens-val">0.0</span></label
          >
          <input
            type="range"
            id="mic-sensitivity"
            min="-60"
            max="60"
            step="0.5"
            value="0.0"
          />
        </div>

        <div class="control-group">
          <label for="dynamic-range"
            >Dynamic Range: <span id="dyn-val">30</span> dB</label
          >
          <input
            type="range"
            id="dynamic-range"
            min="6"
            max="60"
            step="1"
            value="30"
          />
        </div>
      </div>

      <div class="canvas-container">
        <canvas id="strobe-canvas"></canvas>
      </div>
    </div>

    <script type="module" src="main.js?v=1"></script>
  </body>
</html>
